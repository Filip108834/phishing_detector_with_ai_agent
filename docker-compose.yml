services:
  # --- SMTP testowy (przechwytuje maile, NIE wysyła w internet) ---
  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    # dostęp tylko lokalnie na Twoim Windowsie:
    ports:
      - "127.0.0.1:8025:8025"   # UI MailHog
      - "127.0.0.1:1025:1025"   # SMTP
    networks:
      - lab_internal
    restart: unless-stopped

  # --- Gophish (symulacja kampanii) ---
  gophish:
    # opcja A: oficjalna nazwa obrazu z Docker Hub
    image: gophish/gophish:latest
    # opcja B (często używana/utrzymywana): cisagov/gophish-docker
    # image: cisagov/gophish-docker:latest
    container_name: gophish
    # Dostęp tylko lokalnie (ważne!):
    ports:
      - "127.0.0.1:3333:3333"   # panel admin
      - "127.0.0.1:8080:8080"   # serwer phishing (landing)
    environment:
      # Gophish w kampanii będzie wysyłał przez mailhog:
      # (konkretnie ustawisz to w UI Gophish w "Sending Profiles")
      - TZ=Europe/Warsaw
    networks:
      - lab_internal
    depends_on:
      - mailhog
    restart: unless-stopped

  # --- Baza danych (wyniki predykcji, logi eksperymentów) ---
  db:
    image: postgres:16
    container_name: thesis_db
    environment:
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
      POSTGRES_DB: phishing_lab
    # NIE wystawiamy portu na hosta (bezpieczniej).
    # Jeśli kiedyś potrzebujesz debugować DB z hosta, dodaj:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - db_internal
    restart: unless-stopped

  # --- Agent AI (Twoja aplikacja) ---
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_agent
    environment:
      # Konfiguracja DB (agent łączy się po nazwie usługi 'db')
      DATABASE_URL: postgresql+psycopg2://thesis:thesis@db:5432/phishing_lab
      # (Opcjonalnie) mailhog SMTP, jeśli agent ma coś wysyłać
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      TZ: Europe/Warsaw
    # Jeśli agent wystawia API – udostępnij lokalnie:
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - lab_internal
      - db_internal
    depends_on:
      - db
      - mailhog
      - gophish
    restart: unless-stopped

networks:
  # Sieć “lab” – komunikacja Gophish <-> MailHog <-> Agent
  # internal:true ogranicza ruch na zewnątrz (bezpieczniej w labie). :contentReference[oaicite:3]{index=3}
  lab_internal:
    driver: bridge
    internal: true

  # Oddzielna sieć dla DB – tylko agent ma do niej dostęp
  db_internal:
    driver: bridge
    internal: true

volumes:
  db_data:
